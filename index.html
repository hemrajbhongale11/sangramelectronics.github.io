    :root{

      --fk-blue-dark:#1F74BA;
      --fk-yellow:#F8D706;
      --bg:#f1f3f6;
      --text:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --border:#e5e7eb;

    body{

      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;

    a{ text-decoration:none; color:inherit; }

    .fk-topbar{
      background: var(--fk-blue);
      color:#fff;
      position: sticky;
      top: 0;
      z-index: 1030;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
    }
    .brand{
      font-weight: 900;
      letter-spacing: .2px;
      font-size: 1.25rem;
      white-space: nowrap;
      line-height: 1.05;
    }
    .brand small{
      display:block;
      font-size: .72rem;
      opacity:.9;
      margin-top: 2px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .fk-search .form-control{
      border: 0;
      border-radius: 2px 0 0 2px;
      padding: .65rem .9rem;
      font-size: .92rem;
    }
    .fk-search .btn{
      border: 0;
      border-radius: 0 2px 2px 0;
      background: var(--fk-yellow);
      color:#111;
      font-weight:800;
      padding: .65rem 1rem;
    }
    .fk-actions .btn{
      border-radius: 2px;
      font-weight: 800;
      padding: .55rem .85rem;
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      background: rgba(255,255,255,.08);
    }
    .fk-actions .btn:hover{
      background: rgba(255,255,255,.14);
    }

    /* Category strip */
    .cat-strip{
      background:#fff;
      border-bottom: 1px solid var(--border);
    }
    .cat-scroll{
      display:flex;
      gap: 10px;
      overflow:auto;
      padding: 10px 6px;
      scrollbar-width: thin;
    }
    .cat-chip{
      border: 1px solid var(--border);
      background: #fff;
      color:#111;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 999px;
      white-space: nowrap;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .cat-chip:hover{
      transform: translateY(-1px);
      border-color: rgba(4,123,213,.35);
      box-shadow: 0 8px 18px rgba(4,123,213,.12);
    }
    .cat-chip.active{
      background: rgba(4,123,213,.08);
      border-color: rgba(4,123,213,.35);
      color: var(--fk-blue-dark);
    }

    /* Hero */
    .hero-wrap{ margin-top: 14px; }
    .hero-img{
      height: 42vh;
      object-fit: cover;
      border-radius: 8px;
      background: #e5e7eb;
    }
    @media (max-width: 768px){
      .hero-img{ height: 26vh; }
    }

    /* Panel */
    .panel{
      background:#fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    /* Titles */
    .section-title{
      font-weight: 900;
      color:#111;
      font-size: 1.1rem;
      margin: 18px 0 10px;
    }

    /* Product cards */
    .product-card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      height: 100%;
      transition: transform .18s ease, box-shadow .18s ease;

      box-shadow: 0 18px 45px rgba(17,24,39,.12);
    }
    .product-img{
      height: 170px;
      object-fit: contain;
      background: #fff;
      padding: 16px;
      display:block;
      margin: 0 auto;
    }
    .p-body{ padding: 12px 12px 14px; }
    .product-title{
      font-weight: 800;
      font-size: .92rem;
      line-height: 1.25rem;
      min-height: 40px;
    }
    .product-meta{
      color: var(--muted);
      font-size: .82rem;
      margin-top: 4px;
    }
    .price{
      font-weight: 900;
      color: #111;
      font-size: 1.05rem;
    }

    .rating-pill{

      align-items:center;
      gap: 6px;

      color:#fff;
      font-weight: 900;
      font-size: .78rem;

      color:#fff;

      color: var(--muted);
      border-top: 1px solid var(--border);

</head>

   async function loadHeroFromPexels(){
  if(!PEXELS_API_KEY || PEXELS_API_KEY.includes("YOUR_PEXELS_API_KEY_HERE")) return;

  // 🔥 SHOP PHOTO PEHLE (static - hamesha same)
  const shopPhoto = {

    alt: "Sangram Electronics Store"
  };

  const terms = ["smart tv","ceiling fan","refrigerator","washing machine","air conditioner","home appliance"];

  try{
    const requests = terms.map(async (term) => {
      const url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(term)}&per_page=10&orientation=landscape`;
      const res = await fetch(url, { headers: { "Authorization": PEXELS_API_KEY } });
      if(!res.ok) return null;
      const data = await res.json();
      const photos = (data && data.photos) ? data.photos : [];
      if(!photos.length) return null;

      const pick = photos[Math.floor(Math.random() * photos.length)];
      const imgUrl = pick?.src?.landscape || pick?.src?.large || pick?.src?.original;
      return { imgUrl, alt: pick?.alt || term };
    });

    const results = (await Promise.all(requests)).filter(Boolean);
    
    const heroInner = document.getElementById("heroInner");
    heroInner.innerHTML = "";

    // 🔥 1st SLIDE: SHOP PHOTO (ALWAYS FIRST)
    const shopSlide = document.createElement("div");
    shopSlide.className = "carousel-item active";
    shopSlide.innerHTML = `
      <img loading="lazy"
           src="${shopPhoto.imgUrl}"
           class="d-block w-100 hero-img"
           alt="${escapeHtml(shopPhoto.alt)}">
    `;
    heroInner.appendChild(shopSlide);

    // 2nd onwards: API PHOTOS
    results.forEach((r, idx) => {
      const item = document.createElement("div");
      item.className = "carousel-item";
      item.innerHTML = `
        <img loading="lazy"
             src="${r.imgUrl}"
             class="d-block w-100 hero-img"
             alt="${escapeHtml(r.alt)}">
      `;
      heroInner.appendChild(item);
    });

    // Re-init carousel
    const el = document.getElementById("heroCarousel");
    const instance = bootstrap.Carousel.getInstance(el);
    if(instance) instance.dispose();
    new bootstrap.Carousel(el, { interval: 3500, ride: "carousel" });

  } catch (e){ 
    console.warn(e); 
    // Fallback: shop photo + original unsplash images
  }
}

    function updateCartUI(){
      const count = Object.values(cart).reduce((s,n)=>s+n,0);
      document.getElementById('cartCount').innerText = `Cart (${count})`;
    }

    function addToCart(id){ cart[id] = (cart[id]||0) + 1; updateCartUI(); }

    function openCart(){
      const modal = new bootstrap.Modal(document.getElementById('cartModal'));
      const body = document.getElementById('cartBody');
      body.innerHTML = '';
      const entries = Object.entries(cart);

      if(entries.length === 0){
        body.innerHTML = '<p class="mb-0">Your cart is empty.</p>';
        document.getElementById('cartTotal').innerText = '₹0';
      } else {
        let total = 0;
        const list = document.createElement('div'); list.className='list-group';

        entries.forEach(([id,qty])=>{
          const p = products.find(x=>x.id==id);
          const price = p.price * qty;
          total += price;

          const item = document.createElement('div');
          item.className = 'list-group-item bg-light border-0 d-flex justify-content-between align-items-center text-dark';
          item.innerHTML = `<div>
              <div style="font-weight:800">${escapeHtml(p.name)}</div>
              <div class="text-muted small">${escapeHtml(p.brand)} • ₹${numberWithCommas(p.price)} × ${qty}</div>
            </div>
            <div>
              <button class="btn btn-sm btn-outline-dark me-1" onclick="decreaseQty(${p.id})">-</button>
              <button class="btn btn-sm btn-outline-dark" onclick="increaseQty(${p.id})">+</button>
            </div>`;
          list.appendChild(item);
        });

        body.appendChild(list);
        document.getElementById('cartTotal').innerText = `₹${numberWithCommas(total)}`;
      }
      modal.show();
    }

    function increaseQty(id){ cart[id]=(cart[id]||0)+1; openCart(); updateCartUI(); }
    function decreaseQty(id){ if(!cart[id]) return; cart[id]--; if(cart[id]<=0) delete cart[id]; openCart(); updateCartUI(); }

    function renderBest(list){
      const row = document.getElementById('bestRow'); row.innerHTML='';
      const bestList = (list||products).filter(p=>p.best).slice(0,6);

      bestList.forEach(p=>{
        const col = document.createElement('div'); col.className='col-lg-4 col-md-6';
        col.innerHTML = `
          <div class="product-card">
            <div class="p-2 d-flex justify-content-between align-items-center">
              <span class="best-badge">Top Pick</span>
              <small class="text-muted">${escapeHtml(p.brand)}</small>
            </div>
            <div class="text-center px-3 pb-2">
              <img loading="lazy" src="${p.img}" alt="${escapeHtml(p.name)}" class="product-img"
                   onerror="this.src='https://via.placeholder.com/400x300?text=Image+not+found'">
            </div>
            <div class="p-body">
              <div class="product-title">${escapeHtml(p.name)}</div>
              <div class="product-meta">${escapeHtml(p.category)}</div>
              <div class="d-flex justify-content-between align-items-center mt-2">
                <div>
                  <div class="rating-pill"><span>${p.rating.toFixed(1)}</span> ★</div>
                  <div class="price mt-1">${numberWithCommas(p.price)}</div>
                </div>
                <div class="d-flex gap-1">
                  <button class="btn btn-sm btn-fk btn-add" onclick="addToCart(${p.id})">Add</button>
                  <button class="btn btn-sm btn-whatsapp btn-add" onclick="whatsappInquiry(${JSON.stringify(p).replace(/"/g, '&quot;')})" title="Ask Owner on WhatsApp">💬</button>
                </div>
              </div>
            </div>
          </div>
        `;
        row.appendChild(col);
      });
    }

    function renderGrid(list){
      const grid = document.getElementById('gridRow'); grid.innerHTML = '';
      list.forEach(p=>{
        const col=document.createElement('div');
        col.className='col-xl-3 col-lg-4 col-md-6 col-sm-12';
        col.innerHTML = `
          <div class="product-card">
            <div class="text-center px-3 pt-3 pb-2">
              <img loading="lazy" src="${p.img}" alt="${escapeHtml(p.name)}" class="product-img"
                   onerror="this.src='https://via.placeholder.com/400x300?text=Image+not+found'">
            </div>
            <div class="p-body">
              <div class="product-title">${escapeHtml(p.name)}</div>
              <div class="product-meta">${escapeHtml(p.brand)} • ${escapeHtml(p.category)}</div>
              <div class="d-flex justify-content-between align-items-center mt-2">
                <div>
                  <div class="rating-pill"><span>${p.rating.toFixed(1)}</span> ★</div>
                  <div class="price mt-1">${numberWithCommas(p.price)}</div>
                </div>
                <div class="d-flex gap-1">
                  <button class="btn btn-sm btn-outline-dark btn-add" onclick="addToCart(${p.id})">Add</button>
                  <button class="btn btn-sm btn-whatsapp btn-add" onclick="whatsappInquiry(${JSON.stringify(p).replace(/"/g, '&quot;')})" title="Ask Owner on WhatsApp">💬</button>
                </div>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(col);
      });
      document.getElementById('resultCount').innerText = `Showing ${list.length}`;
    }

    function setActiveChip(){
      const ids = ['all','phones','tv','computers','audio','appliances','accessories','cameras'];
      ids.forEach(x=>{
        const el = document.getElementById('chip-'+x);
        if(!el) return;
        el.classList.toggle('active', activeCategory === x);
      });
    }

    function setCategory(cat){
      activeCategory = cat.toLowerCase();
      setActiveChip();
      applyFilters();
    }

    function applyFilters(){
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const sort = document.getElementById('sortSelect').value;
      let list = products.slice();

      if(activeCategory && activeCategory !== 'all'){
        list = list.filter(p => p.category.toLowerCase() === activeCategory);
      }
      if(q){
        list = list.filter(p => (`${p.name} ${p.brand} ${p.category}`).toLowerCase().includes(q));
      }

      if(sort==='price-asc') list.sort((a,b)=>a.price-b.price);
      else if(sort==='price-desc') list.sort((a,b)=>b.price-a.price);
      else if(sort==='rating-desc') list.sort((a,b)=>b.rating - a.rating);

      renderGrid(list);
      renderBest(list);
    }

    function toggleDark(){
      document.documentElement.classList.toggle('dark-mode');
    }

    document.addEventListener('DOMContentLoaded', async ()=>{
      setActiveChip();
      renderBest();
      renderGrid(products);
      updateCartUI();

      document.getElementById('searchInput').addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); applyFilters(); }
      });

      await loadHeroFromPexels();
    });
  </script>
</body>
</html>
